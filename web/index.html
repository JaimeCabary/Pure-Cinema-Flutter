<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Pure Cinema - Uncompromised 4K Cinema Streaming, 10,000+ Worldwide Live TV, and AI CineBot Concierge.">
  <meta name="theme-color" content="#050505">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#050505">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#050505">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pure Cinema">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Pure Cinema · Uncompromised 4K Streaming</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root, html, body {
      background-color: #050505 !important;
      background: #050505 !important;
      color: #ffffff;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    flutter-view, flt-glass-pane, flt-scene-host, canvas {
      background-color: #050505 !important;
      background: #050505 !important;
    }
    #splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      width: 100vw;
      background-color: #050505;
      transition: opacity 0.4s ease-out;
    }
    .cinema-logo-breathing {
      width: 72px;
      height: 72px;
      animation: cinemaBreath 2.2s infinite ease-in-out;
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.35));
    }
    @keyframes cinemaBreath {
      0%, 100% {
        transform: scale(0.95);
        filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
      }
      50% {
        transform: scale(1.06);
        filter: drop-shadow(0 0 24px rgba(255, 255, 255, 0.55));
      }
    }
    .brand-title {
      margin-top: 20px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 5px;
      color: #ffffff;
      text-transform: uppercase;
    }
    .brand-sub {
      margin-top: 6px;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
    }
    .spinner {
      margin-top: 28px;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="splash-container">
    <!-- Pure Cinema Official Vector Logo -->
    <svg class="cinema-logo-breathing" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Film Strip Left -->
      <rect x="3" y="4" width="4" height="16" fill="#09090B" stroke="#E4E4E7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="4" y="5.5" width="2" height="1" rx="0.2" fill="#E4E4E7"/>
      <rect x="4" y="8.5" width="2" height="1" rx="0.2" fill="#E4E4E7"/>
      <rect x="4" y="11.5" width="2" height="1" rx="0.2" fill="#E4E4E7"/>
      <rect x="4" y="14.5" width="2" height="1" rx="0.2" fill="#E4E4E7"/>
      <rect x="4" y="17.5" width="2" height="1" rx="0.2" fill="#E4E4E7"/>

      <!-- Film Strip Right -->
      <rect x="17" y="4" width="4" height="16" fill="#09090B" stroke="#E4E4E7" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="18" y="5.5" width="2" height="1" rx="0.2" fill="#E4E4E7"/>
      <rect x="18" y="8.5" width="2" height="1" rx="0.2" fill="#E4E4E7"/>
      <rect x="18" y="11.5" width="2" height="1" rx="0.2" fill="#E4E4E7"/>
      <rect x="18" y="14.5" width="2" height="1" rx="0.2" fill="#E4E4E7"/>
      <rect x="18" y="17.5" width="2" height="1" rx="0.2" fill="#E4E4E7"/>

      <!-- Center Screen Frame -->
      <rect x="8" y="5" width="8" height="14" rx="1.2" fill="#09090B" stroke="#E4E4E7" stroke-width="1.3"/>
      <line x1="8" y1="9" x2="16" y2="9" stroke="#52525B" stroke-width="0.8"/>
      <line x1="8" y1="15" x2="16" y2="15" stroke="#52525B" stroke-width="0.8"/>

      <!-- Center Play Triangle (Monochrome Crisp White) -->
      <polygon points="10.5,9.5 14.5,12 10.5,14.5" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="0.8"/>
    </svg>

    <div class="brand-title">Pure Cinema</div>
    <div class="brand-sub">Uncompromised Cinema</div>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
