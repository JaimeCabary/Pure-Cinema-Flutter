services:
  # ==========================================
  # 1. Pure Cinema FastAPI Backend Service
  # ==========================================
  - type: web
    name: pure-cinema-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: TMDB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true

# ==========================================
# 2. Pure Cinema Flutter Web (Static Site)
# ==========================================
staticSites:
  - name: pure-cinema-web
    buildCommand: "git clone https://github.com/flutter/flutter.git --depth 1 -b stable flutter-sdk && export PATH=\"$PATH:`pwd`/flutter-sdk/bin\" && flutter pub get && flutter build web --release"
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
